<!doctype html>
<html lang="zh-Hant">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>{{subject}}</title></head>
<body style="margin:0;padding:24px 12px;background:#101a30;color:#edf0f7;font-family:Arial,'Microsoft JhengHei',sans-serif;">
 <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0"><tr><td align="center">
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="max-width:600px;background:#17243c;border:1px solid #49516a;border-radius:12px;">
   <tr><td style="padding:28px 24px 12px;color:#d9c18b;font-size:12px;letter-spacing:2px;">YITING · A MESSAGE FROM THE STARS</td></tr>
   <tr><td style="padding:0 24px 20px;"><h1 style="margin:0;color:#f1e1bc;font-size:22px;line-height:1.5;">{{subject}}</h1></td></tr>
   <tr><td style="padding:0 24px 24px;"><div style="white-space:pre-wrap;overflow-wrap:anywhere;color:#edf0f7;font-size:16px;line-height:1.8;">{{message}}</div></td></tr>
   {{#source}}<tr><td style="padding:8px 24px;font-size:13px;color:#cbd3e4;"><strong>來源：</strong>{{source}}</td></tr>{{/source}}
   {{#entry}}<tr><td style="padding:8px 24px;font-size:13px;color:#cbd3e4;"><strong>入口：</strong>{{entry}}</td></tr>{{/entry}}
   {{#time}}<tr><td style="padding:8px 24px;font-size:13px;color:#cbd3e4;"><strong>時間：</strong>{{time}}</td></tr>{{/time}}
   {{#consent}}<tr><td style="padding:8px 24px;font-size:13px;color:#cbd3e4;"><strong>分享選擇：</strong>{{consent}}</td></tr>{{/consent}}
   <tr><td style="padding:24px;color:#9eabc2;font-size:12px;line-height:1.6;">YiTing Birthday · 網站通知與主動分享<br>入口點擊無法確認訪客身分或是否已閱讀。</td></tr>
  </table>
 </td></tr></table>
</body>
</html>
